workflows:
  android-demo:
    name: Termeh Ahmadian Demo APK
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
    scripts:
      - name: Generate Android project
        script: flutter create --platforms=android --project-name=termeh_ahmadian_demo .
      - name: Get packages
        script: flutter pub get
      - name: Build demo APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
